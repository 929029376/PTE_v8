# PETTrack v8: challenge-annotation-free sparse compositional experts on FELT.
#
# This canonical file is Stage 1 (balanced expert bootstrap). Generate the
# complete Stage 1 -> Stage 2 router -> Stage 3 C3 chain with
# tracking/create_pettrack_ablation_configs.py.

DATA:
  MAX_SAMPLE_INTERVAL: 100
  SAMPLER_MODE: causal
  C3_EVENT_SAMPLING: true
  C3_EVENT_SAMPLE_PROB: 0.8
  C3_EVENT_WEIGHTS:
    ABSENT_TO_PRESENT: 0.35
    VISIBLE_TO_ABSENT: 0.25
    ABSENT_TO_ABSENT: 0.25
    HARD_VISIBLE: 0.15
  SRBT:
    ENABLE: true
    HISTORY_LENGTH: 8
    HORIZONS: [8, 32, 128]
    HORIZON_WEIGHTS: [0.4, 0.35, 0.25]
    MAX_HAZARD: 128
    ANCHOR_WEIGHTS:
      VISIBLE: 0.25
      PRESENT_TO_ABSENT: 0.25
      ABSENT: 0.25
      REAPPEARING: 0.25
  MOTION_CAUSAL_SAMPLING: false
  MOTION_CAUSAL_SAMPLE_PROB: 0.0
  MOTION_CAUSAL_SPEED_THRESHOLD: 0.08
  MOTION_CAUSAL_MAX_TRIES: 8
  ROUTE_MOTION_DROPOUT: 0.1
  ROUTE_MOTION_JITTER_STD: 0.02
  MEAN: [0.485, 0.456, 0.406]
  STD: [0.229, 0.224, 0.225]
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 3
  TRAIN:
    DATASETS_NAME: [FELT]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 106496
  VAL:
    DATASETS_NAME: [FELT_VAL]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 10000

MODEL:
  PRETRAIN_PATH: ./pretrained_networks
  PRETRAIN_FILE: OSTrack_ep0300.pth.tar
  PRETRAINED_BASELINE_CKPT: ""
  SRBT:
    ENABLE: true
    HYPOTHESES:
      IDENTITY_DIM: 64
      K_MAX: 5
      CUMULATIVE_MASS: 0.9
      IDENTITY_COST: 0.6
      BOX_COST: 0.4
      MIN_IDENTITY: 0.4
      MAX_CENTER_DISTANCE: 0.5
      MERGE_IOU: 0.7
      MERGE_IDENTITY: 0.8
      PREVIOUS_WEIGHT: 0.7
      OBSERVATION_WEIGHT: 0.3
      MISS_DECAY: 0.85
      MIN_WEIGHT: 0.05
      MAX_AGE: 32
    CONTROLLER:
      THETA_TRACK: 0.70
      THETA_ENTROPY: 0.35
      THETA_IDENTITY: 0.60
      THETA_MOTION: 0.50
      THETA_ABSENT: 0.60
      THETA_HAZARD8: 0.30
      REDETECT_AGE: 5
      REDETECT_PERIOD: 10
      VERIFY_FRAMES: 3
      LONG_STABLE_FRAMES: 5
  EXTRA_MERGER: false
  PET:
    ENABLE: true
    PHYSICS_ROUTER: true
    HETEROGENEOUS_TAIL: true
    ABSENCE_HEAD: true
    REDETECT_HEAD: true
    STATE_MACHINE: true
    USE_SHARED_BELIEF: true
    USE_LEARNED_POLICY: true
    MEMORY_POLICY: true
  EVENT_BELIEF:
    ENABLE: true
    BELIEF_DIM: 64
  EXPERT:
    ENABLE: true
    ROUTER_ENABLE: true
    HEADS_ENABLE: false
    DEFAULT: generalist
    NAMES: [generalist, motion_fm, small_target_st, visibility_foc_ov, discrimination_bi]
    MAX_ACTIVE: 2
    ROUTER_HIDDEN_DIM: 128
    ROUTE_HYSTERESIS_MARGIN: 0.05
    ROUTE_HYSTERESIS_PATIENCE: 2
  EPSM:
    ALPHA: 0.9
    MIN_HISTORY: 3
    EVENT_THRESHOLD: 0.10
    ROI_FORMAT: xywh
    PHYS_DIM: 8
  ABSENCE:
    HIDDEN_DIM: 64
    BELIEF_DIM: 64
  MEMORY_POLICY:
    HIDDEN_DIM: 64
    GATE_THRESH: 0.5
  REDETECT:
    LAMBDA_H: 1.0
    USE_TEMPLATE_CONDITIONING: true
    USE_PRIOR_GATE: true
    USE_PRIOR: false
    TRAINED_WITH_PRIOR: false
  HETEROGENEOUS_TAIL:
    ENABLE: true
    DEPTH: 3
    DROP_PATH: 0.1
  EVENT_TRIGGER:
    ENABLE: false
    THETA_LOW: 0.02
    THETA_HIGH: 0.15
    MAX_SKIP: 5
  BACKBONE:
    TYPE: pet_vit_base_patch16_224
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [1, 1, 1]
    CE_TEMPLATE_RANGE: CTR_POINT
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
  MEMORY:
    ATU_BETA: 4.0
    AMAH_BETA: 0.25
    AMAH_LAYERS: [5, 8, 11]
    AMAH_SP_LAYERS: [[1, 3], [4, 6], [7, 9]]
  STATE_MACHINE:
    THETA_ABS: 0.6
    W_ABS: 3
    THETA_Z: 2.5
    THETA_RE: 0.7
    W_RE: 2
    W_FAIL: 5
    T_MAX: 50
    T_PERIOD: 10
    T_MIN_BG: 3

TRAIN:
  STAGE: expert
  EXPERT_STAGE: expert
  INIT_CHECKPOINT: ""
  LOAD_LATEST: true
  BACKBONE_MULTIPLIER: 0.1
  BASE_LR_MULTIPLIER_IN_ALL: 0.1
  ROUTER_LR_MULTIPLIER: 3.0
  ROUTER_OBJECTIVE_VERSION: 8
  ROUTER_RESET_ON_OBJECTIVE_MIGRATION: false
  ROUTER_GRAD_CLIP_NORM: 0.1
  FREEZE_BACKBONE_IN_C3: true
  FREEZE_BOX_HEAD_IN_C3: true
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 48
  EPOCH: 100
  LR: 0.0001
  LR_DROP_EPOCH: 45
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  FOCAL_WEIGHT: 1.0
  GRAD_CLIP_NORM: 0.1
  NUM_WORKER: 14
  PIN_MEMORY: true
  PERSISTENT_WORKERS: true
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  WEIGHT_DECAY: 0.0001
  AMP: true
  AMP_DTYPE: bf16
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 1
  VAL_LAST_EPOCHS: 0
  VAL_START_EPOCH: 70
  VAL_SCHEDULE:
    - [70, 79, 5]
    - [80, 89, 3]
    - [90, -1, 1]
  SAVE_EPOCH_INTERVAL: 0
  SAVE_LAST_EPOCHS: 0
  SAVE_EPOCHS: []
  SAVE_LATEST_EACH_EPOCH: true
  SAVE_FINAL_CHECKPOINT: false
  SAVE_BEST: true
  BEST_METRIC: IoU
  BEST_METRIC_MODE: max
  PET_LOSS:
    ROUTE_WEIGHT: 0.0
    ROUTE_REGRET_WEIGHT: 1.0
    ROUTE_ORACLE_CE_WEIGHT: 1.0
    ROUTE_PAIR_PENALTY: 0.02
    ROUTE_CHUNK_SIZE: 3
    ROUTE_TEMPERATURE: 0.03
    ABSENCE_WEIGHT: 1.0
    REDETECT_WEIGHT: 1.0
    FREEZE_WEIGHT: 1.0
    REDETECT_GATE_WEIGHT: 1.0
    ABSENCE_POS_WEIGHT: 3.0
    LABEL_SMOOTHING: 0.0

TEST:
  POLICY_MODE: stateful
  FORCE_ROUTE: ""
  CHECKPOINT: best
  EPOCH: 100
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  SHORTTERM_LIBRARY_NUMS: 5
  LONGTERM_LIBRARY_NUMS: 10
  SAMPLE_INTERVAL: 20
  UPDATE_INTERVAL: 40
  LOWER_BOUND: 0.35
  SCORE_THRESHOLD: 0.7
  ABSENT_SCORE_THRESHOLD: 0.2
  ABSENT_CONFIDENCE_THRESHOLD: 0.0
