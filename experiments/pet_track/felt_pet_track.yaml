# PETTrack v8: SRBT-only FELT tracker.

DATA:
  MAX_SAMPLE_INTERVAL: 100
  SAMPLER_MODE: causal
  SRBT:
    ENABLE: true
    HISTORY_LENGTH: 8
    HORIZONS: [8, 32, 128]
    HORIZON_WEIGHTS: [0.4, 0.35, 0.25]
    MAX_HAZARD: 128
    ANCHOR_WEIGHTS:
      VISIBLE: 0.25
      PRESENT_TO_ABSENT: 0.25
      ABSENT: 0.25
      REAPPEARING: 0.25
  MEAN: [0.485, 0.456, 0.406]
  STD: [0.229, 0.224, 0.225]
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 3
  TRAIN:
    DATASETS_NAME: [FELT]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 4096
  VAL:
    DATASETS_NAME: [FELT_VAL]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 10000

MODEL:
  PRETRAIN_PATH: ./pretrained_networks
  PRETRAIN_FILE: ""
  PRETRAINED_BASELINE_CKPT: "pretrained_networks/AMTTrack_ep0098.pth.tar"
  SRBT:
    ENABLE: true
    HYPOTHESES:
      IDENTITY_DIM: 64
      K_MAX: 5
      CUMULATIVE_MASS: 0.9
      IDENTITY_COST: 0.6
      BOX_COST: 0.4
      MIN_IDENTITY: 0.4
      MAX_CENTER_DISTANCE: 0.5
      MERGE_IOU: 0.7
      MERGE_IDENTITY: 0.8
      PREVIOUS_WEIGHT: 0.7
      OBSERVATION_WEIGHT: 0.3
      MISS_DECAY: 0.85
      MIN_WEIGHT: 0.05
      MAX_AGE: 32
    CONTROLLER:
      THETA_TRACK: 0.70
      THETA_ENTROPY: 0.35
      THETA_IDENTITY: 0.60
      THETA_MOTION: 0.50
      THETA_ABSENT: 0.60
      THETA_HAZARD8: 0.30
      REDETECT_AGE: 5
      REDETECT_PERIOD: 10
      VERIFY_FRAMES: 3
      LONG_STABLE_FRAMES: 5
    TEACHER:
      INPUT_DIM: 768
      POOLED_DIM: 128
      D_MODEL: 256
      NHEAD: 8
      NUM_LAYERS: 2
      FFN_DIM: 1024
      SPATIAL_DIM: 64
      IDENTITY_DIM: 32
      HAZARD_BINS: 129
      MAX_HORIZON: 128
      ENCODE_CHUNK_SIZE: 2
  REDETECT:
    LAMBDA_H: 1.0
    USE_TEMPLATE_CONDITIONING: true
    USE_PRIOR_GATE: true
    USE_PRIOR: false
    TRAINED_WITH_PRIOR: false
  BACKBONE:
    TYPE: pet_vit_base_patch16_224
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [1, 1, 1]
    CE_TEMPLATE_RANGE: CTR_POINT
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
  MEMORY:
    ATU_BETA: 4.0
    AMAH_BETA: 0.25
    AMAH_LAYERS: [5, 8, 11]
    AMAH_SP_LAYERS: [[1, 3], [4, 6], [7, 9]]

TRAIN:
  STAGE: srbt
  LOAD_LATEST: true
  BACKBONE_MULTIPLIER: 0.1
  BASE_LR_MULTIPLIER_IN_ALL: 0.1
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 7
  EPOCH: 60
  LR: 0.0001
  LR_DROP_EPOCH: 45
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  FOCAL_WEIGHT: 1.0
  GRAD_CLIP_NORM: 0.1
  NUM_WORKER: 14
  PIN_MEMORY: true
  PERSISTENT_WORKERS: true
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  WEIGHT_DECAY: 0.0001
  AMP: true
  AMP_DTYPE: bf16
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 1
  VAL_LAST_EPOCHS: 0
  VAL_START_EPOCH: 30
  VAL_SCHEDULE:
    - [30, 39, 5]
    - [40, 49, 2]
    - [50, -1, 1]
  SAVE_EPOCH_INTERVAL: 0
  SAVE_LAST_EPOCHS: 0
  SAVE_EPOCHS: [20, 40, 50, 60]
  SAVE_LATEST_EACH_EPOCH: true
  SAVE_FINAL_CHECKPOINT: false
  SAVE_BEST: true
  BEST_METRIC: IoU
  BEST_METRIC_MODE: max
  SRBT_LOSS:
    EXISTENCE_WEIGHT: 1.0
    SURVIVAL_WEIGHT: 1.0
    FIELD_WEIGHT: 1.0
    HYPOTHESIS_WEIGHT: 0.5
    IDENTITY_WEIGHT: 0.2
    CALIBRATION_WEIGHT: 0.05
    TEACHER_WEIGHT: 1.0
    DISTILL_MAX_WEIGHT: 0.5
    DISTILL_WARMUP: 0.05
    IDENTITY_TEMPERATURE: 0.1
    DIVERSITY_MARGIN: 0.25
    DIVERSITY_WEIGHT: 0.1

TEST:
  POLICY_MODE: stateful
  CHECKPOINT: best
  EPOCH: 60
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  SHORTTERM_LIBRARY_NUMS: 5
  LONGTERM_LIBRARY_NUMS: 10
  SAMPLE_INTERVAL: 20
  UPDATE_INTERVAL: 40
  LOWER_BOUND: 0.35
  SCORE_THRESHOLD: 0.7
  ABSENT_SCORE_THRESHOLD: 0.2
  ABSENT_CONFIDENCE_THRESHOLD: 0.0
