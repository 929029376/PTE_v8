# Final stateful RGB-Event inference contract for the accepted v59 candidate.

DATA:
  MAX_SAMPLE_INTERVAL: 100
  SAMPLER_MODE: causal
  SRBT:
    ENABLE: true
    ANCHOR_WEIGHTS:
      VISIBLE: 0.0
      PRESENT_TO_ABSENT: 0.0
      ABSENT: 0.0
      REAPPEARING: 1.0
  CHALLENGE_SAMPLING:
    ENABLE: true
    PRECISE: true
    MANIFEST: /root/fnvme/PTE_v8_manifests/felt_train_challenges_v3.json
    VAL_MANIFEST: /root/fnvme/PTE_v8_manifests/felt_val_challenges_v3.json
  PURSUIT:
    ENABLE: false
    WINDOW_LENGTH: 4
    CANVAS_SIZE: 352
    TRANSITION_PROBABILITY: 0.0
    REAPPEAR_PROBABILITY: 0.0
  MEAN: [0.485, 0.456, 0.406]
  STD: [0.229, 0.224, 0.225]
  SEARCH:
    CENTER_JITTER: 1.5
    FACTOR: 4.0
    MOTION_CENTER_JITTER_MULTIPLIER: 2.5
    SCALE_JITTER: 0.25
    PRECISION_SCALE_MULTIPLIER: 1.75
    SIZE: 256
    NUMBER: 1
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 3
  TRAIN:
    DATASETS_NAME: [FELT]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 2400
  VAL:
    DATASETS_NAME: [FELT_VAL]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 608

MODEL:
  PRETRAIN_PATH: ./pretrained_networks
  PRETRAIN_FILE: ""
  PRETRAINED_BASELINE_CKPT: "pretrained_networks/AMTTrack_ep0098.pth.tar"
  PRETRAINED_SRBT_CKPT: ""
  PRETRAINED_EXPERT_CKPT: ""
  INIT_CHECKPOINT: "/root/fnvme/PTE_v8_runs/proposal_identity_coverage_v59_20260723/checkpoints/train/pet_track/felt_pet_track_proposal_identity/PETTrack_identity_ep0030_accepted.pth.tar"
  EXPERT:
    ENABLE: true
    DEFAULT: generalist
    NAMES: [generalist, motion_fm, precision_refiner, visibility_foc_ov, discrimination_bi]
    ACTIVATOR_HIDDEN_DIM: 64
    ACTIVATION_THRESHOLD: 0.5
    MAX_ACTIVE_SPECIALISTS: 2
    ACTIVATOR_TRAINED: true
    USE_ACTIVATION_INFERENCE: true
  SEARCH_CONTROLLER:
    ENABLE: true
    HIDDEN_DIM: 64
    MAX_CENTER_STEP: 1.0
    TRAINED: true
    USE_INFERENCE: true
  SRBT:
    ENABLE: true
    GATE:
      HIDDEN_DIM: 128
      RESPONSE_DIM: 3
    HYPOTHESES:
      IDENTITY_DIM: 64
      K_MAX: 5
      CUMULATIVE_MASS: 0.9
      IDENTITY_COST: 0.6
      BOX_COST: 0.4
      MIN_IDENTITY: 0.4
      MAX_CENTER_DISTANCE: 0.5
      MERGE_IOU: 0.7
      MERGE_IDENTITY: 0.8
      PREVIOUS_WEIGHT: 0.7
      OBSERVATION_WEIGHT: 0.3
      MISS_DECAY: 0.85
      MIN_WEIGHT: 0.05
      MAX_AGE: 32
    CONTROLLER:
      THETA_OBSERVABLE: 0.70
      THETA_LOCALIZED: 0.70
      THETA_RECOVER: 0.75
      LOCAL_DURATION: 2
      GLOBAL_DURATION: 4
      VERIFY_DURATION: 2
      LONG_STABLE_DURATION: 5
      HIDDEN_DIM: 16
  REDETECT:
    LAMBDA_H: 1.0
    USE_TEMPLATE_CONDITIONING: true
    USE_PRIOR_GATE: true
    USE_PRIOR: false
    TRAINED_WITH_PRIOR: false
    IDENTITY_DIM: 128
    IDENTITY_THRESHOLD: 0.75
    ACCEPTANCE_THRESHOLD: 0.50
    EVENT_TOP_K: 5
    EVENT_NMS_RADIUS: 12
    EVENT_MIN_ROBUST_SCORE: 3.0
    EVENT_DENSITY_KERNEL_SIZE: 25
    EVENT_PROPOSAL_INFERENCE: true
    RECOVERY_SEARCH_FACTOR: 5.0
    FULL_RGB_FALLBACK_INTERVAL: 10
  BACKBONE:
    TYPE: pet_vit_base_patch16_224
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [1, 1, 1]
    CE_TEMPLATE_RANGE: CTR_POINT
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
  MEMORY:
    ATU_BETA: 4.0
    AMAH_BETA: 0.25
    AMAH_LAYERS: [5, 8, 11]
    AMAH_SP_LAYERS: [[1, 3], [4, 6], [7, 9]]

TEST:
  POLICY_MODE: stateful
  CHECKPOINT: "/root/fnvme/PTE_v8_runs/proposal_identity_coverage_v59_20260723/checkpoints/train/pet_track/felt_pet_track_proposal_identity/PETTrack_identity_ep0030_accepted.pth.tar"
  EPOCH: 20
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  SHORTTERM_LIBRARY_NUMS: 5
  LONGTERM_LIBRARY_NUMS: 10
  SAMPLE_INTERVAL: 20
  UPDATE_INTERVAL: 40
  LOWER_BOUND: 0.35
  SCORE_THRESHOLD: 0.7
  ABSENT_SCORE_THRESHOLD: 0.2
  ABSENT_CONFIDENCE_THRESHOLD: 0.0
