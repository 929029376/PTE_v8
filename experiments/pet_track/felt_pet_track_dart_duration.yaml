# DART duration decoder: train causal state semantics without changing v39 factors.

DATA:
  MAX_SAMPLE_INTERVAL: 100
  SAMPLER_MODE: causal
  SRBT:
    ENABLE: true
    ANCHOR_WEIGHTS:
      VISIBLE: 0.25
      PRESENT_TO_ABSENT: 0.25
      ABSENT: 0.25
      REAPPEARING: 0.25
  CHALLENGE_SAMPLING:
    ENABLE: true
    PRECISE: true
    MANIFEST: /root/fnvme/PTE_v8_manifests/felt_train_challenges_v3.json
    VAL_MANIFEST: /root/fnvme/PTE_v8_manifests/felt_val_challenges_v3.json
  PURSUIT:
    ENABLE: false
    WINDOW_LENGTH: 8
    CANVAS_SIZE: 352
    TRANSITION_PROBABILITY: 0.0
    REAPPEAR_PROBABILITY: 0.0
  MEAN: [0.485, 0.456, 0.406]
  STD: [0.229, 0.224, 0.225]
  SEARCH:
    CENTER_JITTER: 1.5
    FACTOR: 4.0
    MOTION_CENTER_JITTER_MULTIPLIER: 2.5
    SCALE_JITTER: 0.25
    PRECISION_SCALE_MULTIPLIER: 1.75
    SIZE: 256
    NUMBER: 1
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 3
  TRAIN:
    DATASETS_NAME: [FELT]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 2400
  VAL:
    DATASETS_NAME: [FELT_VAL]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 600

MODEL:
  PRETRAIN_PATH: ./pretrained_networks
  PRETRAIN_FILE: ""
  PRETRAINED_BASELINE_CKPT: "pretrained_networks/AMTTrack_ep0098.pth.tar"
  PRETRAINED_SRBT_CKPT: ""
  PRETRAINED_EXPERT_CKPT: ""
  INIT_CHECKPOINT: "/root/fnvme/PTE_v8_runs/dart_reliability_v39_20260721/checkpoints/train/pet_track/felt_pet_track_dart_reliability/PETTrack_latest.pth.tar"
  EXPERT:
    ENABLE: true
    DEFAULT: generalist
    NAMES: [generalist, motion_fm, precision_refiner, visibility_foc_ov, discrimination_bi]
    ACTIVATOR_HIDDEN_DIM: 64
    ACTIVATION_THRESHOLD: 0.5
    MAX_ACTIVE_SPECIALISTS: 2
    ACTIVATOR_TRAINED: true
    USE_ACTIVATION_INFERENCE: false
  SEARCH_CONTROLLER:
    ENABLE: true
    HIDDEN_DIM: 64
    MAX_CENTER_STEP: 1.0
    TRAINED: true
    USE_INFERENCE: true
  SRBT:
    ENABLE: true
    GATE:
      HIDDEN_DIM: 128
      RESPONSE_DIM: 3
    HYPOTHESES:
      IDENTITY_DIM: 64
      K_MAX: 5
      CUMULATIVE_MASS: 0.9
      IDENTITY_COST: 0.6
      BOX_COST: 0.4
      MIN_IDENTITY: 0.4
      MAX_CENTER_DISTANCE: 0.5
      MERGE_IOU: 0.7
      MERGE_IDENTITY: 0.8
      PREVIOUS_WEIGHT: 0.7
      OBSERVATION_WEIGHT: 0.3
      MISS_DECAY: 0.85
      MIN_WEIGHT: 0.05
      MAX_AGE: 32
    CONTROLLER:
      THETA_OBSERVABLE: 0.70
      THETA_LOCALIZED: 0.70
      THETA_RECOVER: 0.75
      LOCAL_DURATION: 2
      GLOBAL_DURATION: 4
      VERIFY_DURATION: 2
      LONG_STABLE_DURATION: 5
      HIDDEN_DIM: 16
  REDETECT:
    LAMBDA_H: 1.0
    USE_TEMPLATE_CONDITIONING: true
    USE_PRIOR_GATE: true
    USE_PRIOR: false
    TRAINED_WITH_PRIOR: false
    IDENTITY_DIM: 128
    IDENTITY_THRESHOLD: 0.75
    ACCEPTANCE_THRESHOLD: 0.50
    EVENT_TOP_K: 5
    EVENT_NMS_RADIUS: 12
    EVENT_MIN_ROBUST_SCORE: 3.0
    RECOVERY_SEARCH_FACTOR: 5.0
    FULL_RGB_FALLBACK_INTERVAL: 10
  BACKBONE:
    TYPE: pet_vit_base_patch16_224
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [1, 1, 1]
    CE_TEMPLATE_RANGE: CTR_POINT
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
  MEMORY:
    ATU_BETA: 4.0
    AMAH_BETA: 0.25
    AMAH_LAYERS: [5, 8, 11]
    AMAH_SP_LAYERS: [[1, 3], [4, 6], [7, 9]]

TRAIN:
  STAGE: recovery
  EXPERT_PHASE: recovery
  DART_DECODER_ONLY: true
  SPECIALIST_EXPERT_IDS: [3]
  SPECIALIST_EXPERT_SCHEDULE: []
  LOAD_LATEST: false
  REBASE_SCHEDULER_ON_RESUME: true
  BACKBONE_MULTIPLIER: 0.1
  BASE_LR_MULTIPLIER_IN_ALL: 0.1
  EXPERT_LR_MULTIPLIER: 5.0
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 12
  MIN_EPOCH: 3
  EPOCH: 12
  REFINE_MAX_EPOCH: 12
  LR: 0.0005
  PURSUIT_LR: 0.0001
  MOTION_DISPLACEMENT_WEIGHT: 1.0
  ACTIVATOR_LR: 0.0001
  ACTIVATOR_ADVANTAGE_MARGIN: 0.02
  ACTIVATOR_POS_WEIGHT: [4.0, 5.0, 1.5, 2.5]
  SMALL_TARGET_ADAPTER_LR: 0.0
  LR_DROP_EPOCH: 8
  REFINE_TAIL_LR: 0.000001
  REFINE_MEMORY_LR: 0.0000005
  REFINE_SEQUENCE_VAL_SCHEDULE:
    - [1, -1, 1]
  GIOU_WEIGHT: 6.0
  L1_WEIGHT: 10.0
  FOCAL_WEIGHT: 1.0
  EXPERT_ADVANTAGE_WEIGHT: 2.0
  EXPERT_ADVANTAGE_MARGIN: 0.10
  SMALL_TARGET_CENTER_RANK_WEIGHT: 1.0
  SMALL_TARGET_MATCH_RANK_WEIGHT: 0.5
  SMALL_TARGET_DENSE_SIZE_WEIGHT: 1.0
  SMALL_TARGET_DENSE_OFFSET_WEIGHT: 1.0
  SMALL_TARGET_SOFT_BOX_TEMPERATURE: 0.2
  GRAD_CLIP_NORM: 30.0
  NUM_WORKER: 5
  PIN_MEMORY: true
  PERSISTENT_WORKERS: true
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 25
  WEIGHT_DECAY: 0.0001
  AMP: true
  AMP_DTYPE: bf16
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 1
  VAL_LAST_EPOCHS: 0
  VAL_START_EPOCH: 1
  VAL_SCHEDULE:
    - [1, 12, 1]
  SEQUENCE_VAL_ENABLE: false
  SEQUENCE_VAL_SCHEDULE: []
  SEQUENCE_VAL_TRAIN_IOU_THRESHOLD: 0.0
  SAVE_EPOCH_INTERVAL: 0
  SAVE_LAST_EPOCHS: 0
  SAVE_EPOCHS: []
  SAVE_LATEST_EACH_EPOCH: true
  SAVE_FINAL_CHECKPOINT: false
  SAVE_BEST: true
  BEST_LOADER: val
  BEST_METRIC: Loss/dart_decoder
  BEST_METRIC_MODE: min
  SPECIALIST_GATE_ENABLE: false
  SPECIALIST_MIN_COUNT: 100
  SPECIALIST_MIN_DELTA: 0.02
  GENERALIST_REFERENCE_IOU: 0.7229794659718115
  GENERALIST_MAX_DROP: 0.005
  VISIBILITY_REFERENCE_REAPPEAR_IOU: 0.051049665982931064
  VISIBILITY_REFERENCE_REAPPEAR_SUCCESS: 0.0
  VISIBILITY_REFERENCE_RGB_FALSE_ACCEPT_RATE: 1.0
  SRBT_LOSS:
    EXISTENCE_WEIGHT: 1.0
    FOCAL_GAMMA: 2.0
  RECOVERY_LOSS:
    IDENTITY_WEIGHT: 1.0
    RANKING_WEIGHT: 0.5
    RANKING_MARGIN: 0.2
  DART_LOSS:
    COVERAGE_WEIGHT: 1.0
    GEOMETRY_WEIGHT: 1.0
    RANKING_WEIGHT: 0.5
    RANKING_MARGIN: 0.2
    DECODER_WEIGHT: 1.0

TEST:
  POLICY_MODE: stateful
  CHECKPOINT: best
  EPOCH: 20
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  SHORTTERM_LIBRARY_NUMS: 5
  LONGTERM_LIBRARY_NUMS: 10
  SAMPLE_INTERVAL: 20
  UPDATE_INTERVAL: 40
  LOWER_BOUND: 0.35
  SCORE_THRESHOLD: 0.7
  ABSENT_SCORE_THRESHOLD: 0.2
  ABSENT_CONFIDENCE_THRESHOLD: 0.0
