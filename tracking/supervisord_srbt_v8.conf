[unix_http_server]
file=/root/fnvme/PTE_v8_runs/srbt_main_20260712/supervisor/srbt_v8.sock
chmod=0700

[supervisord]
logfile=/root/fnvme/PTE_v8_runs/srbt_main_20260712/logs/supervisord_srbt_v8.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/root/fnvme/PTE_v8_runs/srbt_main_20260712/supervisor/srbt_v8.pid
childlogdir=/root/fnvme/PTE_v8_runs/srbt_main_20260712/logs
nodaemon=false
minfds=4096
minprocs=200
strip_ansi=true

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/fnvme/PTE_v8_runs/srbt_main_20260712/supervisor/srbt_v8.sock
prompt=pettrack-srbt-v8

[program:pettrack_srbt_v8]
command=/root/venvs/attrack/bin/python tracking/train.py --script pet_track --config felt_pet_track --save_dir /root/fnvme/PTE_v8_runs/srbt_main_20260712 --mode multiple --nproc_per_node 2 --use_wandb 0
directory=/root/projects/PTE_v8_srbt_20260712
user=root
umask=022
autostart=false
autorestart=unexpected
startsecs=20
startretries=3
exitcodes=0
stopsignal=TERM
stopwaitsecs=180
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/root/fnvme/PTE_v8_runs/srbt_main_20260712/logs/srbt_train.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1",FELT_DATA_ROOT="/root/fnvme/FELT",FELT_TRAIN_ROOT="/root/fnvme/FELT/train",FELT_VAL_ROOT="/root/fnvme/FELT/train",AMTTRACK_WORKSPACE_DIR="/root/projects/PTE_v8_srbt_20260712/workspace",PETTRACK_PROJECT_DIR="/root/projects/PTE_v8_srbt_20260712",PETTRACK_SAVE_DIR="/root/fnvme/PTE_v8_runs/srbt_main_20260712",PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True"
