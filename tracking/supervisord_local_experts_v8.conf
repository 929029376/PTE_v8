[program:pettrack_local_experts_v8]
command=/root/venvs/attrack/bin/python tracking/train.py --script pet_track --config felt_pet_track --save_dir /root/fnvme/PTE_v8_runs/route_free_specialize_20260716 --mode multiple --nproc_per_node 2 --use_wandb 0
directory=/root/projects/PTE_v8_local_experts_20260714
user=root
umask=022
autostart=true
autorestart=unexpected
startsecs=20
startretries=3
exitcodes=0
stopsignal=TERM
stopwaitsecs=180
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/root/fnvme/PTE_v8_runs/route_free_specialize_20260716/logs/train_supervisor.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1",FELT_DATA_ROOT="/root/fnvme/FELT",FELT_TRAIN_ROOT="/root/fnvme/FELT/train",FELT_VAL_ROOT="/root/fnvme/FELT/train",AMTTRACK_WORKSPACE_DIR="/root/projects/PTE_v8_local_experts_20260714/workspace",PETTRACK_PROJECT_DIR="/root/projects/PTE_v8_local_experts_20260714",PETTRACK_SAVE_DIR="/root/fnvme/PTE_v8_runs/route_free_specialize_20260716",PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True"

